    <div class="container">

        <!--<p><a href="/" class="youtube">Watch the video explainer</a></p>-->
        ###html###
        <hr>
        <p><span class="opacity"><a href="https://ip.mysearch.one" target="_blank">🌐 My IP</a> <a href="https://pomodoro.mysearch.one" target="_blank">🍅 Pomodoro</a></span><br><small>© 2025 ⁃ Made by <a href="https://www.linkedin.com/in/fedorananin/" target="_blank">Fёdor Ananin</a></small></p>

    <script>
        function copyToClipboard(text){
            if(navigator.clipboard){
                navigator.clipboard.writeText(text)
                return //codes below wont be executed
            }
            const textArea = document.createElement("textarea")
            textArea.value = text
            document.body.appendChild(textArea)
            textArea.focus()
            textArea.select()
            document.execCommand('copy')
            document.body.removeChild(textArea)
        }
    document.addEventListener('DOMContentLoaded', function() {
        const copyElements = document.querySelectorAll('.copycopy');
        
        copyElements.forEach(function(element) {
            element.addEventListener('click', function() {
                // Get the value from the input
                const textToCopy = this.value;
                copyToClipboard(textToCopy);
                // Show visual feedback that text was copied
                const originalValue = this.value;
                const originalBgColor = this.style.backgroundColor;
                
                // Change appearance to indicate success
                this.value = "Copied!";
                this.style.backgroundColor = "#4CAF50"; // Green background
                
                // Reset back to original state after a short delay
                setTimeout(() => {
                    this.value = originalValue;
                    this.style.backgroundColor = originalBgColor;
                }, 1000); // Reset after 1 second
            });
        });
    });
    // Tip rotation script
    document.addEventListener('DOMContentLoaded', function() {
        const tipSpan = document.querySelector('p.tip span');
        if (!tipSpan) return;
        
        // Array of tip messages
        const tips = [
            'Type <code>funny cats !youtube</code> to search in 🐈 YouTube.',
            'Use <code>!ai</code> at the end to ask AI assistants 🤖.',
            'Try 🔍 <code>!g</code> for Google, <code>!b</code> for Bing, <code>!y</code> for Yandex.',
            'Add <code>!gmaps</code>, <code>/gmaps</code>, <code>-gmaps</code>, <code>:gmaps</code>, or <code>@gmaps</code> to search in 🗺️ Google Maps.',
            'Type <code>my ip</code> to check your 🛜 IP address.',
            'Type <code>pomodoro</code> to open the 🍅 Pomodoro timer.',
            'You can change the default search engine on the ⚙️ "Settings" page.'
        ];
        
        let currentTipIndex = 0;
        
        // Function to update the tip text
        function rotateTip() {
            currentTipIndex = (currentTipIndex + 1) % tips.length;
            tipSpan.innerHTML = tips[currentTipIndex];
        }
        
        // Set interval to change tip every 5 seconds
        setInterval(rotateTip, 5000);
    });
    document.addEventListener("DOMContentLoaded", () => {
            const searchBox = document.getElementById("search-box");
            const dataList = document.getElementById("search-box-list");
            const searchForm = document.getElementById("search-form");
            let debounceTimer;
            let selectedFromDatalist = false; // Flag for selection from list

            // Fill lastSuggestions with predefined values
            let lastSuggestions = Array.from(dataList.options).map(option => option.value);

            // Track clicks on suggestions (PC only)
            dataList.addEventListener("mousedown", () => {
                selectedFromDatalist = true;
            });

            // Also track manual input (this triggers on TAP)
            searchBox.addEventListener("input", () => {
                selectedFromDatalist = lastSuggestions.includes(searchBox.value);
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    fetchSuggestions(searchBox.value);
                }, 300);
            });

            // If switched after selection (means clicked/tapped)
            searchBox.addEventListener("change", () => {
                if (selectedFromDatalist) {
                    searchForm.submit(); // Submit the form ✅
                }
                selectedFromDatalist = false; // Reset the flag
            });

            function fetchSuggestions(query) {
                if (query.trim() === "") {
                    dataList.innerHTML = "";
                    lastSuggestions = [];
                    return;
                }

                fetch(`suggestions.php?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        lastSuggestions = data[1] || []; // Update suggestions list
                        populateDatalist(lastSuggestions);
                    })
                    .catch(error => console.error("Error loading data:", error));
            }

            function populateDatalist(suggestions) {
                dataList.innerHTML = "";
                suggestions.forEach(suggestion => {
                    dataList.innerHTML += `<option value="${suggestion}">${suggestion}</option>`;
                });
            }
        });
    </script>
